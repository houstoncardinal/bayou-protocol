[build]
  command = "npm run build"
  publish = "dist"

# Browser caching (repeat visits and second matches load from the player's disk, not the network).
# Code bundles have content hashes in their names: cached for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
# Models, textures, sounds and maps keep their names between versions: used from the cache for a day, and
# refreshed in the background for a week after that (an update reaches players within a day).
[[headers]]
  for = "/game/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# Security headers for every page. Chosen so nothing the game uses is blocked: the microphone (voice chat,
# asked for only when you turn it on), fullscreen, gamepads, and being embedded on another site (itch.io).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "microphone=(self), camera=(), geolocation=(), payment=(), usb=(), fullscreen=(self), gamepad=(self)"
    Strict-Transport-Security = "max-age=31536000"
